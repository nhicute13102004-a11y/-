<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>작품 등록</title>

    <!-- Google Material Symbols -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">

    <!-- Google Font -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: #f7f5f5;
            color: #333;
        }


        .register-page {
            width: 100%;
            max-width: 700px;
            min-height: 100vh;
            margin: auto;
            background: white;
        }


        /* ================= HEADER ================= */

        .register-header {
            height: 75px;

            display: flex;
            align-items: center;

            padding: 0 22px;

            border-bottom: 1px solid #eeeeee;
        }


        .back-btn {
            border: none;
            background: none;

            cursor: pointer;

            display: flex;
            align-items: center;
        }


        .back-btn span {
            font-size: 30px;
        }


        .header-title {
            flex: 1;

            text-align: center;

            font-size: 20px;

            font-weight: 600;

            margin-right: 30px;
        }


        /* ================= CONTENT ================= */

        .content {
            padding: 25px 22px 40px;
        }


        .intro {
            margin-bottom: 25px;
        }


        .intro h1 {
            font-size: 25px;

            margin-bottom: 7px;
        }


        .intro p {
            color: #999;

            font-size: 14px;
        }


        /* ================= IMAGE ================= */

        .image-box {
            width: 100%;
            height: 230px;

            border-radius: 16px;

            background: #faf7f7;

            border: 1px dashed #ddd;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            overflow: hidden;

            margin-bottom: 25px;
        }


        .image-box .material-symbols-rounded {
            font-size: 45px;

            color: #d98696;

            margin-bottom: 10px;
        }


        .image-box p {
            color: #999;

            font-size: 14px;
        }


        #preview {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: none;
        }


        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            font-size: 15px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        .required {
            color: #df657c;
        }


        input,
        select,
        textarea {

            width: 100%;

            border: 1px solid #e5e5e5;

            border-radius: 10px;

            padding: 13px 14px;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            background: white;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #df9aa7;
        }


        textarea {

            height: 130px;

            resize: none;

            line-height: 1.6;
        }


        /* ================= BUTTON ================= */

        .register-btn {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 12px;

            background: #df657c;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 10px;
        }


        .register-btn:hover {
            background: #d85770;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .content {
                padding: 22px 18px 35px;
            }

            .image-box {
                height: 210px;
            }

        }

    </style>

</head>


<body>


<div class="register-page">


    <!-- ================= HEADER ================= -->

    <header class="register-header">

        <button class="back-btn"
                onclick="history.back()">

            <span class="material-symbols-rounded">
                arrow_back
            </span>

        </button>


        <h1 class="header-title">
            작품 등록
        </h1>

    </header>



    <!-- ================= CONTENT ================= -->

    <main class="content">


        <div class="intro">

            <h1>
                나의 작품을 소개해보세요 🎨
            </h1>

            <p>
                작품 정보를 입력하고 전시회에 등록해보세요.
            </p>

        </div>



        <!-- ================= IMAGE ================= -->

        <div class="image-box"
             onclick="document.getElementById('imageInput').click()">

            <span class="material-symbols-rounded"
                  id="uploadIcon">

                add_photo_alternate

            </span>


            <p id="uploadText">
                작품 이미지를 선택해주세요
            </p>


            <img id="preview">

        </div>


        <input
            type="file"
            id="imageInput"
            accept="image/*"
            style="display:none"
        >



        <!-- ================= FORM ================= -->

        <div class="form-group">

            <label>
                작품명 <span class="required">*</span>
            </label>

            <input
                type="text"
                id="title"
                placeholder="작품명을 입력해주세요"
            >

        </div>



        <div class="form-group">

            <label>
                작가명 <span class="required">*</span>
            </label>

            <input
                type="text"
                id="author"
                placeholder="작가명을 입력해주세요"
            >

        </div>



        <div class="form-group">

            <label>
                카테고리 <span class="required">*</span>
            </label>

            <select id="category">

                <option value="">
                    카테고리를 선택해주세요
                </option>

                <option value="회화">
                    회화
                </option>

                <option value="사진">
                    사진
                </option>

                <option value="디자인">
                    디자인
                </option>

                <option value="영상">
                    영상
                </option>

                <option value="기타">
                    기타
                </option>

            </select>

        </div>



        <div class="form-group">

            <label>
                작품 설명
            </label>

            <textarea
                id="description"
                placeholder="작품에 대한 설명을 작성해주세요."
            ></textarea>

        </div>



        <!-- ================= BUTTON ================= -->

        <button class="register-btn"
                onclick="registerWork()">

            작품 등록하기

        </button>


    </main>

</div>



<!-- ================= JAVASCRIPT ================= -->

<script>

    // 이미지 미리보기

    document
        .getElementById("imageInput")
        .addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (!file) {
                return;
            }

            const preview =
                document.getElementById("preview");

            const uploadIcon =
                document.getElementById("uploadIcon");

            const uploadText =
                document.getElementById("uploadText");


            preview.src =
                URL.createObjectURL(file);

            preview.style.display = "block";

            uploadIcon.style.display = "none";

            uploadText.style.display = "none";

        });



    // 작품 등록

    function registerWork() {

        const title =
            document.getElementById("title").value;

        const author =
            document.getElementById("author").value;

        const category =
            document.getElementById("category").value;


        // 필수 입력 확인

        if (title === "") {

            alert("작품명을 입력해주세요.");

            return;
        }


        if (author === "") {

            alert("작가명을 입력해주세요.");

            return;
        }


        if (category === "") {

            alert("카테고리를 선택해주세요.");

            return;
        }


        // 등록 완료

        alert("작품이 등록되었습니다! 🎉");

        location.href = "index.html";

    }

</script>


</body>

</html>
